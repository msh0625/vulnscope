[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscope"
version = "0.1.0"
description = "AI-assisted vulnerability scanner for open source projects"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
vulnscope = "vulnscope.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vulnscope*"]
