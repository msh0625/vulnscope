server {
    listen 80;
    server_name example.com;

    # No HTTPS redirect
    # No rate limiting
    # No authentication

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # No authorization headers
        # No IP restrictions
    }

    location /admin {
        proxy_pass http://backend:8080/admin;
        # Admin panel exposed without auth
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        # CORS wildcard
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods *;
    }

    location /internal/ {
        # Internal API exposed publicly
        proxy_pass http://internal-service:9090/;
    }

    # Directory listing enabled
    autoindex on;

    # Debug headers exposed
    add_header X-Powered-By "Node.js v18";
    add_header X-Debug-Info "backend-01";
}
